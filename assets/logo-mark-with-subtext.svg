<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700;800&amp;display=swap');
      .plex-mark { font-family: 'IBM Plex Mono', SFMono-Regular, monospace; }
    </style>
    <clipPath id="tile-clip">
      <rect width="256" height="256" rx="56" />
    </clipPath>
  </defs>

  <!-- Dark Plum Rounded Tile Base -->
  <rect width="256" height="256" rx="56" fill="#2f2738" />

  <!-- Outer RSS Arc -->
  <path fill="#f7f5f0" d="M 213 213 h -34 a 147 147 0 0 0 -147 -147 V 32 a 181 181 0 0 1 181 181 z" />

  <!-- Inner RSS Arc -->
  <path fill="#f7f5f0" opacity="0.88" d="M 160 213 h -34 a 94 94 0 0 0 -94 -94 V 85 a 128 128 0 0 1 128 128 z" />

  <!-- Full Monospace 'rxs' Token -->
  <text x="18" y="208" fill="#f7f5f0" class="plex-mark" font-size="58" font-weight="800" letter-spacing="-3">r<tspan fill="#9b7ac4">x</tspan>s</text>

  <!-- URL Band -->
  <rect y="216" width="256" height="40" fill="#9b7ac4" clip-path="url(#tile-clip)" />
  <text x="128" y="242" fill="#2f2738" class="plex-mark" font-size="15" font-weight="700" letter-spacing="0.25" text-anchor="middle">https://rxs.sh</text>
</svg>
